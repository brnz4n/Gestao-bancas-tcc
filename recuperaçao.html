<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaTCC - Recuperação</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/AvaliaTCC icon.png">
    
    <style>
        .card-glass {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .anime-start {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .anime-end {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-scale {
            transition: transform 0.2s;
        }
        .hover-scale:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body class="d-flex flex-column align-items-center" 
      style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh;">

    <div class="container-fluid px-5">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2 anime-start" href="index.html">
            <img src="imagens/AvaliaTCC LOGO.png" alt="logo_avalia" height="70"></i>
        </a>
</div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4" style="min-width: 320px;">

                <div class="card card-glass border-0 p-4 anime-start" style="transition-delay: 0.1s;">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-primary">Recuperar Senha</h3>
                            <p class="text-muted small">Insira seu e-mail ou matrícula cadastrada para receber as instruções.</p>
                        </div>

                        <form action="dashboard_admin.html" method="GET">
                            
                            <div class="mb-3">
                                <label for="matricula" class="form-label small fw-bold text-secondary ps-1">E-mail ou Matrícula</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-primary"><i class='bx bx-envelope'></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="matricula" name="matricula" placeholder="Digite aqui..." required>
                                </div>
                            </div>

                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm hover-scale">
                                    ENVIAR CÓDIGO
                                </button>
                                <a href="login.html" class="btn btn-outline-secondary rounded-pill py-2 fw-bold border-0">
                                    Voltar ao Login
                                </a>
                            </div>
            </div>
        </div>
        <div class="text-center mt-4 anime-start" style="transition-delay: 0.2s;">
            <p class="text-muted small opacity-75">© 2026 AvaliaTCC - Sistema de Gerenciamento de Bancas Avaliadoras.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                var elementos = document.querySelectorAll('.anime-start');
                elementos.forEach(function(elemento) {
                    elemento.classList.add('anime-end');
                });
            }, 100);

            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#senha');
            const icon = togglePassword.querySelector('i');

            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                icon.classList.toggle('bx-show');
                icon.classList.toggle('bx-hide');
            });
        });
    </script>
</body>
</html>
